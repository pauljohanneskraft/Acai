name: Acai
options:
  bundleIdPrefix: de.kraftsoftware
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  fileTypes:
    "icon":
      file: true
packages:
  Acai:
    path: ..
  # Used by `GitFixtureRepository` — iOS's Foundation has no `Process`/`Pipe` to shell out to `git`.
  SwiftGitX:
    url: https://github.com/ibrahimcetin/SwiftGitX.git
    from: 0.4.0
targets:
  Acai-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
    dependencies:
      - package: Acai
        product: AcaiApp
    info:
      path: iOS/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Açaí
    settings:
      base:
        PRODUCT_NAME: Acai
        PRODUCT_BUNDLE_IDENTIFIER: de.kraftsoftware.Acai
        DEVELOPMENT_TEAM: TJSHMGE2VX
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    scheme:
      gatherCoverageData: false

  # The snapshot tests. Both platforms share one `AcaiUITests/` source tree; `Fixtures/` is a
  # separate resources path so its fixtures get copied rather than compiled.
  Acai-iOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AcaiUITests
        excludes:
          - "Fixtures/**"
          # Read directly off disk by `ScreenshotComparator`, not bundled (leaf-name collisions otherwise).
          - "__Snapshots__/**"
      - path: AcaiUITests/Fixtures
        buildPhase: resources
        type: folder
    dependencies:
      - target: Acai-iOS
      - package: SwiftGitX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kraftsoftware.Acai.UITests
        DEVELOPMENT_TEAM: TJSHMGE2VX
        SWIFT_VERSION: "6.0"
        # Record-mode toggle for `ScreenshotComparator`; a shell `export` doesn't reach XCTest.
        ACAI_RECORD_SNAPSHOTS: "0"
        # Signing needs an Info.plist this target lacked.
        GENERATE_INFOPLIST_FILE: YES

  Acai-macOSUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AcaiUITests
        excludes:
          - "Fixtures/**"
          # Read directly off disk by `ScreenshotComparator`, not bundled (leaf-name collisions otherwise).
          - "__Snapshots__/**"
      - path: AcaiUITests/Fixtures
        buildPhase: resources
        type: folder
    dependencies:
      - target: Acai-macOS
      - package: SwiftGitX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.kraftsoftware.Acai.UITests
        DEVELOPMENT_TEAM: TJSHMGE2VX
        SWIFT_VERSION: "6.0"
        ACAI_RECORD_SNAPSHOTS: "0"
        # Signing needs an Info.plist this target lacked.
        GENERATE_INFOPLIST_FILE: YES
        # Extends Xcode's auto-generated entitlements with `/private/tmp` write access for fixture staging.
        CODE_SIGN_ENTITLEMENTS: AcaiUITests-macOS.entitlements

  Acai-macOS:
    type: application
    platform: macOS
    sources:
      - path: macOS
    dependencies:
      - package: Acai
        product: AcaiApp
    info:
      path: macOS/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        NSHighResolutionCapable: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: Açaí
    settings:
      base:
        PRODUCT_NAME: Acai
        PRODUCT_BUNDLE_IDENTIFIER: de.kraftsoftware.Acai
        DEVELOPMENT_TEAM: TJSHMGE2VX
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # App Sandbox (B06): the shipping app, unlike the UI-test runner (which already had its
        # own entitlements file), had none until now.
        CODE_SIGN_ENTITLEMENTS: Acai-macOS.entitlements
    scheme:
      gatherCoverageData: false

# XcodeGen's per-target `scheme:` shorthand doesn't register test targets as testable, so declared explicitly.
schemes:
  Acai-iOSUITests:
    build:
      targets:
        Acai-iOSUITests: [test]
    test:
      config: Debug
      targets:
        - Acai-iOSUITests
      environmentVariables:
        - variable: ACAI_RECORD_SNAPSHOTS
          value: "$(ACAI_RECORD_SNAPSHOTS)"
          isEnabled: true
  Acai-macOSUITests:
    build:
      targets:
        Acai-macOSUITests: [test]
    test:
      config: Debug
      targets:
        - Acai-macOSUITests
      environmentVariables:
        - variable: ACAI_RECORD_SNAPSHOTS
          value: "$(ACAI_RECORD_SNAPSHOTS)"
          isEnabled: true
