name: 'Açaí quality gate'
description: >-
  Downloads a released acai binary for the runner's platform and runs `acai quality` against this
  checkout, failing the job on any architecture-rule violation.
author: 'pauljohanneskraft'
branding:
  icon: 'shield'
  color: 'green'

inputs:
  version:
    description: >-
      Released acai version to install, e.g. v1.2.3. Defaults to the latest release.
    required: false
    default: 'latest'
  source:
    description: 'Path to the source directory to analyze.'
    required: false
    default: '.'
  rules:
    description: 'Path to a quality.yml rules file. Omit to use the built-in curated smell budgets.'
    required: false
    default: ''
  baseline:
    description: 'Stored analysis name or .json path to compare against for drift reporting.'
    required: false
    default: ''
  format:
    description: 'Report format: human or json.'
    required: false
    default: 'human'
  output:
    description: 'Path to additionally write the report to. The report is always available as the report output.'
    required: false
    default: ''

outputs:
  report:
    description: 'The rendered quality report.'
    value: ${{ steps.run-quality.outputs.report }}

runs:
  using: composite
  steps:
    - name: Install acai
      shell: bash
      run: |
        set -euo pipefail
        case "$(uname -s)" in
          Linux) platform=linux ;;
          Darwin) platform=macos ;;
          *) echo "::error::acai has no release build for this OS: $(uname -s)" >&2; exit 1 ;;
        esac
        case "$(uname -m)" in
          x86_64|amd64) arch=x86_64 ;;
          arm64|aarch64) arch=arm64 ;;
          *) echo "::error::acai has no release build for this architecture: $(uname -m)" >&2; exit 1 ;;
        esac

        version="${{ inputs.version }}"
        asset="acai-${platform}-${arch}.tar.gz"
        if [ "$version" = "latest" ]; then
          base_url="https://github.com/${{ github.action_repository }}/releases/latest/download"
        else
          base_url="https://github.com/${{ github.action_repository }}/releases/download/${version}"
        fi

        work_dir="$(mktemp -d)"
        curl -fsSL "$base_url/$asset" -o "$work_dir/$asset"
        curl -fsSL "$base_url/$asset.sha256" -o "$work_dir/$asset.sha256"
        (
          cd "$work_dir"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "$asset.sha256"
          else
            shasum -a 256 -c "$asset.sha256"
          fi
        )

        install_dir="$RUNNER_TEMP/acai-bin"
        mkdir -p "$install_dir"
        tar -xzf "$work_dir/$asset" -C "$install_dir" acai
        chmod +x "$install_dir/acai"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Run acai quality
      id: run-quality
      shell: bash
      run: |
        set -euo pipefail
        report_file="$(mktemp)"
        args=(quality --source "${{ inputs.source }}" --format "${{ inputs.format }}" --output "$report_file")
        if [ -n "${{ inputs.rules }}" ]; then
          args+=(--rules "${{ inputs.rules }}")
        fi
        if [ -n "${{ inputs.baseline }}" ]; then
          args+=(--baseline "${{ inputs.baseline }}")
        fi

        set +e
        acai "${args[@]}"
        status=$?
        set -e

        cat "$report_file"
        if [ -n "${{ inputs.output }}" ]; then
          cp "$report_file" "${{ inputs.output }}"
        fi

        {
          echo "report<<ACAI_QUALITY_REPORT_EOF"
          cat "$report_file"
          echo "ACAI_QUALITY_REPORT_EOF"
        } >> "$GITHUB_OUTPUT"

        exit $status
