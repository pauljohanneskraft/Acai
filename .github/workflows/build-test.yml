name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/realm/swiftlint:0.57.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build-test-ios:
    name: Unit Test iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: App/.spm-cache
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-

      # Real iOS Simulator coverage, not just macOS/Linux — some code genuinely differs by platform.
      - name: Run SPM unit tests on iOS Simulator
        run: |
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme AcaiPackageTests-iOS \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO
        working-directory: App

  prepare-ui-test-ios:
    name: Prepare UI Test iOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: App/.spm-cache
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-

      # ui-test-iphone/ui-test-ipad reuse this via test-without-building instead of recompiling.
      - name: Build for testing (UI test bundle)
        run: |
          xcodebuild build-for-testing \
            -project Acai.xcodeproj \
            -scheme Acai-iOSUITests \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO
        working-directory: App

      - name: Package build-for-testing artifact
        run: tar -czf ui-test-products.tar.gz -C DerivedData Build
        working-directory: App

      - uses: actions/upload-artifact@v7
        with:
          name: ios-ui-test-products
          path: App/ui-test-products.tar.gz
          retention-days: 1

  build-test-macos:
    name: Unit Test macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Materialize LFS-tracked PNGs so the Examples/ image regression tests see real bytes.
          lfs: true

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test --parallel --enable-code-coverage

      - name: Generate code coverage
        run: |
          xcrun llvm-cov export -format="lcov" \
            .build/debug/AcaiPackageTests.xctest/Contents/MacOS/AcaiPackageTests \
            -instr-profile .build/debug/codecov/default.profdata > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

  build-test-linux:
    name: Unit Test Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: swift:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test --parallel

  ui-test-iphone:
    name: UI Test iPhone
    needs: [prepare-ui-test-ios]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Materialize LFS-tracked screenshot goldens under App/AcaiUITests/__Snapshots__/.
          lfs: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/download-artifact@v8
        with:
          name: ios-ui-test-products
          path: App

      - name: Unpack build-for-testing artifact
        run: |
          mkdir -p DerivedData
          tar -xzf ui-test-products.tar.gz -C DerivedData
        working-directory: App

      # Deliberately serial. Cloning simulators for `-parallel-testing-enabled` makes each test
      # 3-8x slower on a runner this size and starts failing app launches outright ("Failed to
      # launch"), so the suite took longer *and* flaked; iPhone and iPad already run concurrently as
      # separate jobs. It is still worth passing locally, where there are cores to spare.
      - name: Prepare Simulator
        run: Scripts/simulator_prepare.sh "iPhone 17"

      - name: Run UI tests
        id: run-tests
        run: |
          XCTESTRUN=$(find DerivedData -name '*.xctestrun' | head -1)
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2
        working-directory: App

      - name: Screenshot drift summary
        if: always()
        run: Scripts/snapshot_drift_summary.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-iphone
          path: App/TestResults.xcresult
          if-no-files-found: warn

      # ScreenshotComparator writes every capture to __RecordedSnapshots__/ as a side effect of the
      # normal (asserting) run above — not only in record mode — so a golden mismatch/miss there
      # already leaves this folder ready to download and drop over __Snapshots__/iPhone/, with no
      # second xcodebuild invocation needed.
      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iPhone
          path: App/AcaiUITests/__RecordedSnapshots__/iPhone/
          if-no-files-found: warn

  ui-test-ipad:
    name: UI Test iPad
    needs: [prepare-ui-test-ios]
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Materialize LFS-tracked screenshot goldens under App/AcaiUITests/__Snapshots__/.
          lfs: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - uses: actions/download-artifact@v8
        with:
          name: ios-ui-test-products
          path: App

      - name: Unpack build-for-testing artifact
        run: |
          mkdir -p DerivedData
          tar -xzf ui-test-products.tar.gz -C DerivedData
        working-directory: App

      - name: Prepare Simulator
        run: Scripts/simulator_prepare.sh "iPad (A16)"

      - name: Run UI tests
        id: run-tests
        run: |
          XCTESTRUN=$(find DerivedData -name '*.xctestrun' | head -1)
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,name=iPad (A16)" \
            -resultBundlePath TestResults.xcresult \
            -retry-tests-on-failure \
            -test-iterations 2
        working-directory: App

      - name: Screenshot drift summary
        if: always()
        run: Scripts/snapshot_drift_summary.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-ipad
          path: App/TestResults.xcresult
          if-no-files-found: warn

      # ScreenshotComparator writes every capture to __RecordedSnapshots__/ as a side effect of the
      # normal (asserting) run above — not only in record mode — so a golden mismatch/miss there
      # already leaves this folder ready to download and drop over __Snapshots__/iPad/, with no
      # second xcodebuild invocation needed.
      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iPad
          path: App/AcaiUITests/__RecordedSnapshots__/iPad/
          if-no-files-found: warn

  ui-test-macos:
    name: UI Test macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Materialize LFS-tracked screenshot goldens under App/AcaiUITests/__Snapshots__/.
          lfs: true

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: App/.spm-cache
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-

      - name: Run UI tests
        id: run-tests
        run: |
          # Unlike the iOS Simulator jobs above, a real macOS binary needs at least an ad-hoc
          # signature to launch at all on Apple Silicon — `CODE_SIGNING_ALLOWED=NO` (which works
          # fine for Simulator, which doesn't enforce this) makes the OS kill the process on launch
          # with "Acai.app is damaged and can't be opened" (verified empirically: AMFI rejects an
          # unsigned Mach-O outright, it's not actual corruption). Ad-hoc signing needs no
          # certificate/team, so this works identically here and on a real Mac.
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-macOSUITests \
            -destination "platform=macOS" \
            -clonedSourcePackagesDirPath .spm-cache \
            -retry-tests-on-failure \
            -test-iterations 2 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=""
        working-directory: App

      - name: Screenshot drift summary
        if: always()
        run: Scripts/snapshot_drift_summary.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-macos
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          if-no-files-found: warn

      # ScreenshotComparator writes every capture to /private/tmp/AcaiUITestSnapshots as a side
      # effect of the normal (asserting) run above — not only in record mode — so a golden
      # mismatch/miss there already leaves this ready to upload, with no second xcodebuild
      # invocation needed. Sync first in case the direct entitled write unexpectedly fell back to
      # the sandboxed runner's own container (see ScreenshotComparator.write's doc comment) — a
      # no-op the rest of the time.
      - name: Sync staged snapshots
        if: always()
        run: Scripts/sync_ui_snapshots.sh

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macOS
          path: /private/tmp/AcaiUITestSnapshots/macOS/
          if-no-files-found: warn
