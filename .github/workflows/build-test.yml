name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  # Each iOS journey device runs as this many parallel jobs; each takes every Nth enumerated test.
  UI_TEST_SHARDS: 4

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      journeys: ${{ steps.journeys.outputs.journeys }}
      shards: ${{ steps.shards.outputs.shards }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide whether journeys run
        id: journeys
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            JOURNEYS=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | Scripts/ci_needs_journeys.sh)
          else
            JOURNEYS=true
          fi
          echo "journeys=$JOURNEYS" >> "$GITHUB_OUTPUT"
          echo "UI journeys: $JOURNEYS" >> "$GITHUB_STEP_SUMMARY"

      - name: List shard indices
        id: shards
        run: echo "shards=$(seq -s, 1 "$UI_TEST_SHARDS" | sed 's/.*/[&]/')" >> "$GITHUB_OUTPUT"

  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/realm/swiftlint:0.57.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run SwiftLint
        run: swiftlint lint --strict

  # One job builds the journeys' bundle and runs the iOS unit tests, sharing one DerivedData so the
  # package is compiled once and only one macOS runner slot is taken.
  build-test-ios:
    name: Unit Test iOS
    needs: [changes]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: App/.spm-cache
          key: spm-xcode-v2-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: spm-xcode-v2-${{ runner.os }}-

      # The ui-test-ios matrix reuses this via test-without-building instead of recompiling. Built for
      # the same concrete simulator as the unit tests below: a `generic/` destination adds x86_64 and
      # makes that step recompile the whole package.
      # `-disablePackageRepositoryCache` on every xcodebuild using `.spm-cache`: otherwise a restored
      # checkout points into ~/Library/Caches/org.swift.swiftpm, which a fresh runner doesn't have, and
      # package resolution fails ("cannot change to …/repositories/tree-sitter-dart-…").
      - name: Build for testing (UI test bundle)
        if: needs.changes.outputs.journeys == 'true'
        run: |
          xcodebuild build-for-testing \
            -project Acai.xcodeproj \
            -scheme Acai-iOSUITests \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            -disablePackageRepositoryCache \
            CODE_SIGNING_ALLOWED=NO
        working-directory: App

      - name: Package build-for-testing artifact
        if: needs.changes.outputs.journeys == 'true'
        run: tar -czf ui-test-products.tar.gz -C DerivedData Build
        working-directory: App

      - uses: actions/upload-artifact@v7
        if: needs.changes.outputs.journeys == 'true'
        with:
          name: ios-ui-test-products
          path: App/ui-test-products.tar.gz
          retention-days: 1

      # Real iOS Simulator coverage, not just macOS/Linux — some code genuinely differs by platform.
      - name: Run SPM unit tests on iOS Simulator
        run: |
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme AcaiPackageTests-iOS \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -derivedDataPath DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            -disablePackageRepositoryCache \
            CODE_SIGNING_ALLOWED=NO
        working-directory: App

  build-test-macos:
    name: Unit Test macOS
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Materialize LFS-tracked PNGs so the Examples/ image regression tests see real bytes.
          lfs: true

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show Swift version
        run: swift --version

      # No separate `swift build`: coverage instrumentation makes `swift test` rebuild everything anyway.
      - name: Run tests
        run: swift test --parallel --enable-code-coverage

      - name: Generate code coverage
        run: |
          xcrun llvm-cov export -format="lcov" \
            .build/debug/AcaiPackageTests.xctest/Contents/MacOS/AcaiPackageTests \
            -instr-profile .build/debug/codecov/default.profdata > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

  build-test-linux:
    name: Unit Test Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: swift:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test --parallel

  ui-test-ios:
    name: UI Test ${{ matrix.platform }} (${{ matrix.shard }})
    needs: [changes, build-test-ios]
    # Runs even if the iOS unit tests failed: journeys report on their own, and a missing bundle fails
    # the download step below instead of silently skipping.
    if: ${{ !cancelled() && needs.changes.outputs.journeys == 'true' }}
    runs-on: macos-26
    # A whole serial iPad suite has taken 56 minutes on this runner; a shard gets its share plus margin.
    # A hung test is bounded by the per-test allowance below, not by this.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        platform: [iPhone, iPad]
        shard: ${{ fromJSON(needs.changes.outputs.shards) }}
        include:
          - platform: iPhone
            device: iPhone 17
          - platform: iPad
            device: iPad (A16)
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Materialize LFS-tracked screenshot goldens under App/AcaiUITests/__Snapshots__/.
          lfs: true

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - uses: actions/download-artifact@v8
        with:
          name: ios-ui-test-products
          path: App

      - name: Unpack build-for-testing artifact
        run: |
          mkdir -p DerivedData
          tar -xzf ui-test-products.tar.gz -C DerivedData
        working-directory: App

      - name: Prepare Simulator
        run: |
          APP=$(find App/DerivedData/Build/Products -maxdepth 2 -path '*-iphonesimulator/Acai.app' | head -1)
          [ -n "$APP" ] || { echo "✗ No built Acai.app under App/DerivedData/Build/Products" >&2; exit 1; }
          Scripts/simulator_prepare.sh "${{ matrix.device }}" "$APP"

      # Enumerating launches the test runner on the simulator, so it reflects exactly what would run.
      - name: Select this shard's tests
        run: |
          XCTESTRUN=$(find DerivedData -name 'Acai-iOSUITests_*.xctestrun' | head -1)
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,name=${{ matrix.device }}" \
            -enumerate-tests \
            -test-enumeration-style flat \
            -test-enumeration-format json \
            -test-enumeration-output-path ui-tests.json
          ../Scripts/ui_test_shard.sh "${{ matrix.shard }}" "$UI_TEST_SHARDS" ui-tests.json > shard-tests.txt
          {
            echo "### Shard ${{ matrix.shard }} of $UI_TEST_SHARDS"
            sed 's/^/- `/; s/$/`/' shard-tests.txt
          } >> "$GITHUB_STEP_SUMMARY"
        working-directory: App

      # Serial within a shard: simulator clones for `-parallel-testing-enabled` made each test 3-8x
      # slower on this runner and failed app launches outright. No `-retry-tests-on-failure` either:
      # a retry hid real failures inside green jobs and re-ran non-idempotent actions. A hung test
      # fails after its allowance instead of consuming the job's timeout.
      - name: Run UI tests
        run: |
          if [ ! -s shard-tests.txt ]; then
            echo "No tests in this shard."
            exit 0
          fi
          ONLY_TESTING=()
          while IFS= read -r TEST; do ONLY_TESTING+=("-only-testing:$TEST"); done < shard-tests.txt
          XCTESTRUN=$(find DerivedData -name 'Acai-iOSUITests_*.xctestrun' | head -1)
          xcodebuild test-without-building \
            -xctestrun "$XCTESTRUN" \
            -destination "platform=iOS Simulator,name=${{ matrix.device }}" \
            "${ONLY_TESTING[@]}" \
            -resultBundlePath TestResults.xcresult \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600
        working-directory: App

      - name: Screenshot drift summary
        if: always()
        run: Scripts/snapshot_drift_summary.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-${{ matrix.platform }}-shard-${{ matrix.shard }}
          path: App/TestResults.xcresult
          if-no-files-found: warn

      # Every capture lands in __RecordedSnapshots__/ as a side effect of the run above, ready for
      # `Scripts/snapshots_accept.sh` to drop over __Snapshots__/.
      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}-shard-${{ matrix.shard }}
          path: App/AcaiUITests/__RecordedSnapshots__/${{ matrix.platform }}/
          if-no-files-found: warn

      # The runner's "Complete job" waits for orphaned processes, and has hung past the job timeout
      # after every step had finished; leave no simulator running behind.
      - name: Shut down simulators
        if: always()
        run: xcrun simctl shutdown all || true

  ui-test-macos:
    name: UI Test macOS
    needs: [changes]
    if: needs.changes.outputs.journeys == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # Materialize LFS-tracked screenshot goldens under App/AcaiUITests/__Snapshots__/.
          lfs: true

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Cache SPM dependencies
        uses: actions/cache@v6
        with:
          path: App/.spm-cache
          key: spm-xcode-v2-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: spm-xcode-v2-${{ runner.os }}-

      - name: Run UI tests
        id: run-tests
        run: |
          # Unlike the iOS Simulator jobs above, a real macOS binary needs at least an ad-hoc
          # signature to launch at all on Apple Silicon — `CODE_SIGNING_ALLOWED=NO` (which works
          # fine for Simulator, which doesn't enforce this) makes the OS kill the process on launch
          # with "Acai.app is damaged and can't be opened" (verified empirically: AMFI rejects an
          # unsigned Mach-O outright, it's not actual corruption). Ad-hoc signing needs no
          # certificate/team, so this works identically here and on a real Mac.
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-macOSUITests \
            -destination "platform=macOS" \
            -clonedSourcePackagesDirPath .spm-cache \
            -disablePackageRepositoryCache \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 300 \
            -maximum-test-execution-time-allowance 600 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=""
        working-directory: App

      - name: Screenshot drift summary
        if: always()
        run: Scripts/snapshot_drift_summary.sh

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: xcresult-macos
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          if-no-files-found: warn

      # ScreenshotComparator writes every capture to /private/tmp/AcaiUITestSnapshots as a side
      # effect of the normal (asserting) run above — not only in record mode — so a golden
      # mismatch/miss there already leaves this ready to upload, with no second xcodebuild
      # invocation needed. Sync first in case the direct entitled write unexpectedly fell back to
      # the sandboxed runner's own container (see ScreenshotComparator.write's doc comment) — a
      # no-op the rest of the time.
      - name: Sync staged snapshots
        if: always()
        run: Scripts/sync_ui_snapshots.sh

      - name: Upload UI test screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macOS
          path: /private/tmp/AcaiUITestSnapshots/macOS/
          if-no-files-found: warn

  # The one required status check: journeys are skipped for changes they can't be affected by and
  # sharded under matrix names, so requiring individual jobs would block or miss runs.
  ci-result:
    name: CI Result
    if: always()
    needs: [changes, lint, build-test-ios, build-test-macos, build-test-linux, ui-test-ios, ui-test-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed or been skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "✗ A required job failed or was cancelled." >&2
          exit 1
