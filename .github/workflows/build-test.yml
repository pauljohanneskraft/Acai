name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/realm/swiftlint:0.57.1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run SwiftLint
        run: swiftlint lint --strict

  build-test-ios:
    name: Unit Test iOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: App/.spm-cache
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-

      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Acai.xcodeproj \
            -scheme Acai-iOS \
            -destination "generic/platform=iOS Simulator" \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO
        working-directory: App

  build-test-macos:
    name: Unit Test macOS
    runs-on: macos-26
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Materialize LFS-tracked PNGs so the Examples/ image regression tests see real bytes.
          lfs: true

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test --parallel --enable-code-coverage

      - name: Generate code coverage
        run: |
          xcrun llvm-cov export -format="lcov" \
            .build/debug/AcaiPackageTests.xctest/Contents/MacOS/AcaiPackageTests \
            -instr-profile .build/debug/codecov/default.profdata > coverage.lcov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
        continue-on-error: true

  build-test-linux:
    name: Unit Test Linux
    runs-on: ubuntu-latest
    container:
      image: swift:latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            .build/checkouts
            .build/repositories
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build -v

      - name: Run tests
        run: swift test --parallel

  ui-test-iphone:
    name: UI Test iPhone
    needs: [lint, build-test-ios]
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Materialize LFS-tracked screenshot goldens under App/AcaiUITests/__Snapshots__/.
          lfs: true

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: App/.spm-cache
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-

      - name: Prepare Simulator
        run: Scripts/simulator_prepare.sh "iPhone 17"

      - name: Run UI tests
        id: run-tests
        run: |
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-iOSUITests \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO
        working-directory: App

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-iphone
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          if-no-files-found: warn

      # Re-runs just the screenshot-comparing classes in record mode (never asserts — see
      # ScreenshotComparator.record's doc comment) so a golden mismatch/miss that failed the run
      # above produces the same drop-in-ready PNG folder record-snapshots.yml used to, without a
      # separate manual workflow run. The simulator from the run above is already booted.
      - name: Record UI test screenshots
        if: steps.run-tests.outcome == 'failure'
        run: |
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-iOSUITests \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -only-testing:Acai-iOSUITests/ScreenshotJourneyTests \
            -only-testing:Acai-iOSUITests/CompareGitRevisionTests \
            -only-testing:Acai-iOSUITests/NewSheetsScreenshotTests \
            -only-testing:Acai-iOSUITests/GeneratedDiagramScreenshotTests \
            CODE_SIGNING_ALLOWED=NO ACAI_RECORD_SNAPSHOTS=1
        working-directory: App

      - name: Upload recorded snapshots
        if: steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: iPhone
          path: App/AcaiUITests/__RecordedSnapshots__/iPhone/
          if-no-files-found: warn

  ui-test-ipad:
    name: UI Test iPad
    needs: [lint, build-test-ios]
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Materialize LFS-tracked screenshot goldens under App/AcaiUITests/__Snapshots__/.
          lfs: true

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: App/.spm-cache
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-

      - name: Prepare Simulator
        run: Scripts/simulator_prepare.sh "iPad (A16)"

      - name: Run UI tests
        id: run-tests
        run: |
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-iOSUITests \
            -destination "platform=iOS Simulator,name=iPad (A16)" \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGNING_ALLOWED=NO
        working-directory: App

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-ipad
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          if-no-files-found: warn

      # Re-runs just the screenshot-comparing classes in record mode (never asserts — see
      # ScreenshotComparator.record's doc comment) so a golden mismatch/miss that failed the run
      # above produces the same drop-in-ready PNG folder record-snapshots.yml used to, without a
      # separate manual workflow run. The simulator from the run above is already booted.
      - name: Record UI test screenshots
        if: steps.run-tests.outcome == 'failure'
        run: |
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-iOSUITests \
            -destination "platform=iOS Simulator,name=iPad (A16)" \
            -only-testing:Acai-iOSUITests/ScreenshotJourneyTests \
            -only-testing:Acai-iOSUITests/CompareGitRevisionTests \
            -only-testing:Acai-iOSUITests/NewSheetsScreenshotTests \
            -only-testing:Acai-iOSUITests/GeneratedDiagramScreenshotTests \
            CODE_SIGNING_ALLOWED=NO ACAI_RECORD_SNAPSHOTS=1
        working-directory: App

      - name: Upload recorded snapshots
        if: steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: iPad
          path: App/AcaiUITests/__RecordedSnapshots__/iPad/
          if-no-files-found: warn

  ui-test-macos:
    name: UI Test macOS
    needs: [lint, build-test-macos]
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Materialize LFS-tracked screenshot goldens under App/AcaiUITests/__Snapshots__/.
          lfs: true

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Cache SPM dependencies
        uses: actions/cache@v4
        with:
          path: App/.spm-cache
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved', 'App/project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-

      - name: Run UI tests
        id: run-tests
        run: |
          # Unlike the iOS Simulator jobs above, a real macOS binary needs at least an ad-hoc
          # signature to launch at all on Apple Silicon — `CODE_SIGNING_ALLOWED=NO` (which works
          # fine for Simulator, which doesn't enforce this) makes the OS kill the process on launch
          # with "Acai.app is damaged and can't be opened" (verified empirically: AMFI rejects an
          # unsigned Mach-O outright, it's not actual corruption). Ad-hoc signing needs no
          # certificate/team, so this works identically here and on a real Mac.
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-macOSUITests \
            -destination "platform=macOS" \
            -clonedSourcePackagesDirPath .spm-cache \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM=""
        working-directory: App

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-macos
          path: ~/Library/Developer/Xcode/DerivedData/*/Logs/Test/*.xcresult
          if-no-files-found: warn

      # Re-runs just the screenshot-comparing classes in record mode (never asserts — see
      # ScreenshotComparator.record's doc comment) so a golden mismatch/miss that failed the run
      # above produces the same drop-in-ready PNG folder record-snapshots.yml used to, without a
      # separate manual workflow run.
      - name: Record UI test screenshots
        if: steps.run-tests.outcome == 'failure'
        run: |
          # ScreenshotComparator writes recordings directly to /private/tmp/AcaiUITestSnapshots on
          # macOS (an entitled, non-container path — see its own `outputDirectory` doc comment), so
          # this should just succeed. It still stages to a container tmp dir as a last-resort
          # fallback if that direct write ever unexpectedly fails, reporting it as an XCTFail (so
          # xcodebuild exits nonzero even though recording itself still completed) — tolerate that
          # one known, benign signature specifically, not any nonzero exit blanket.
          set +e
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-macOSUITests \
            -destination "platform=macOS" \
            -only-testing:Acai-macOSUITests/ScreenshotJourneyTests \
            -only-testing:Acai-macOSUITests/CompareGitRevisionTests \
            -only-testing:Acai-macOSUITests/NewSheetsScreenshotTests \
            -only-testing:Acai-macOSUITests/GeneratedDiagramScreenshotTests \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" \
            ACAI_RECORD_SNAPSHOTS=1 2>&1 | tee /tmp/record-macos.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Recording succeeded outright."
            exit 0
          fi

          unexpected=$(grep -E ": error:" /tmp/record-macos.log | grep -v "Could not write recorded snapshot" || true)
          if [ -n "$unexpected" ]; then
            echo "Recording failed for a reason other than the known macOS sandbox staging fallback:"
            echo "$unexpected"
            exit "$status"
          fi

          echo "Nonzero exit, but every failure matches the known macOS sandbox staging fallback — treating as a successful recording."
        working-directory: App

      - name: Sync staged snapshots
        if: steps.run-tests.outcome == 'failure'
        run: Scripts/sync_ui_snapshots.sh

      - name: Upload recorded snapshots
        if: steps.run-tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: /private/tmp/AcaiUITestSnapshots/macOS/
          if-no-files-found: warn
