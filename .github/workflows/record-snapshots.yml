name: Record Snapshots

# Manual only: re-records the snapshot-test screenshots and uploads each platform's own output as a
# downloadable artifact, so a human can copy the ones that actually changed over the committed
# `App/AcaiUITests/__Snapshots__/<platform>/` goldens instead of re-recording locally. Recording
# never asserts, so the resulting PNGs still need human review before committing.
#
# Recording never touches `__Snapshots__/` itself — it's only ever read (`ScreenshotComparator`
# compares each fresh capture against it) and written to a separate output location
# (`ScreenshotComparator.outputDirectory`: a fixed `/private/tmp` path on macOS, required by its
# sandbox entitlements; a plain sibling directory on iOS/iPad, which has no such restriction). A
# state that still matches its committed golden closely enough gets that golden's own bytes copied
# into the output, not a fresh, byte-different-by-rendering-noise capture — so a human can drop the
# whole output on top of `__Snapshots__/<platform>/` and only genuinely-changed states show up in
# `git status`, with no per-state judgment call needed about what to keep.
on:
  workflow_dispatch:

jobs:
  record-iphone:
    name: Record iPhone
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Prepare Simulator
        run: Scripts/simulator_prepare.sh "iPhone 17"

      - name: Record UI test screenshots
        run: |
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-iOSUITests \
            -destination "platform=iOS Simulator,name=iPhone 17" \
            -only-testing:Acai-iOSUITests/ScreenshotJourneyTests \
            -only-testing:Acai-iOSUITests/CompareGitRevisionTests \
            -only-testing:Acai-iOSUITests/NewSheetsScreenshotTests \
            -only-testing:Acai-iOSUITests/GeneratedDiagramScreenshotTests \
            CODE_SIGNING_ALLOWED=NO ACAI_RECORD_SNAPSHOTS=1
        working-directory: App

      - name: Upload recorded snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPhone
          path: App/AcaiUITests/__RecordedSnapshots__/iPhone/
          if-no-files-found: error

  record-ipad:
    name: Record iPad
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Prepare Simulator
        run: Scripts/simulator_prepare.sh "iPad (A16)"

      - name: Record UI test screenshots
        run: |
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-iOSUITests \
            -destination "platform=iOS Simulator,name=iPad (A16)" \
            -only-testing:Acai-iOSUITests/ScreenshotJourneyTests \
            -only-testing:Acai-iOSUITests/CompareGitRevisionTests \
            -only-testing:Acai-iOSUITests/NewSheetsScreenshotTests \
            -only-testing:Acai-iOSUITests/GeneratedDiagramScreenshotTests \
            CODE_SIGNING_ALLOWED=NO ACAI_RECORD_SNAPSHOTS=1
        working-directory: App

      - name: Upload recorded snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iPad
          path: App/AcaiUITests/__RecordedSnapshots__/iPad/
          if-no-files-found: error

  record-macos:
    name: Record macOS
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure Git to use HTTPS
        run: 'git config --global url."https://github.com/".insteadOf git@github.com:'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.5"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: App

      - name: Record UI test screenshots
        run: |
          # ScreenshotComparator writes recordings directly to /private/tmp/AcaiUITestSnapshots on
          # macOS (an entitled, non-container path — see its own `outputDirectory` doc comment), so
          # this should just succeed. It still stages to a container tmp dir as a last-resort
          # fallback if that direct write ever unexpectedly fails, reporting it as an XCTFail (so
          # xcodebuild exits nonzero even though recording itself still completed) — tolerate that
          # one known, benign signature specifically, not any nonzero exit blanket.
          set +e
          xcodebuild test \
            -project Acai.xcodeproj \
            -scheme Acai-macOSUITests \
            -destination "platform=macOS" \
            -only-testing:Acai-macOSUITests/ScreenshotJourneyTests \
            -only-testing:Acai-macOSUITests/CompareGitRevisionTests \
            -only-testing:Acai-macOSUITests/NewSheetsScreenshotTests \
            -only-testing:Acai-macOSUITests/GeneratedDiagramScreenshotTests \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=YES DEVELOPMENT_TEAM="" \
            ACAI_RECORD_SNAPSHOTS=1 2>&1 | tee /tmp/record-macos.log
          status=${PIPESTATUS[0]}
          set -e

          if [ "$status" -eq 0 ]; then
            echo "Recording succeeded outright."
            exit 0
          fi

          unexpected=$(grep -E ": error:" /tmp/record-macos.log | grep -v "Could not write recorded snapshot" || true)
          if [ -n "$unexpected" ]; then
            echo "Recording failed for a reason other than the known macOS sandbox staging fallback:"
            echo "$unexpected"
            exit "$status"
          fi

          echo "Nonzero exit, but every failure matches the known macOS sandbox staging fallback — treating as a successful recording."
        working-directory: App

      - name: Sync staged snapshots
        if: always()
        run: Scripts/sync_ui_snapshots.sh

      - name: Upload recorded snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macOS
          path: /private/tmp/AcaiUITestSnapshots/macOS/
          if-no-files-found: error
